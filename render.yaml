services:
  - type: web
    name: bittrace-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bittrace-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: bittrace-db
    databaseName: bittrace
    user: bittrace
    plan: free
